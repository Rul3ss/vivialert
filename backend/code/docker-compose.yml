services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Sem "ports": o banco não precisa ficar exposto na máquina nem na rede.
    # Para abrir o psql localmente: docker compose exec db psql -U ${DB_USER}
    volumes:
      - tripalert_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      PORT: 3000
      # Container não tem TTY: sem CI=true, o pnpm aborta quando precisa
      # refazer o node_modules do volume após mudar dependências
      # (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
      CI: "true"
      API_KEY: ${API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PRICE_PROVIDER: ${PRICE_PROVIDER:-fake}
      SERPAPI_KEY: ${SERPAPI_KEY}
      CHECK_INTERVAL_MINUTES: ${CHECK_INTERVAL_MINUTES:-720}
      WATCH_ENABLED: ${WATCH_ENABLED:-true}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /health testa o banco de verdade (o "/" do starter não testava nada).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  tripalert_data:
