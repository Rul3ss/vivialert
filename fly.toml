# Deploy: API no Fly.io, vigia como cron do GitHub Actions.
#
# Só a API sai daqui. O frontend é estático (`web/dist`) e pode ir para
# Netlify/Vercel/Cloudflare Pages — ou você simplesmente não publica o front e
# usa a API pelo curl, porque o objetivo da amiga é receber no Telegram.
#
# Antes de fazer deploy:
#   fly volumes create tripalert_data --size 1 --region gru
#   fly secrets set DATABASE_URL=... API_KEY=... TELEGRAM_BOT_TOKEN=... \
#                   TELEGRAM_CHAT_ID=... SERPAPI_KEY=...
#   fly deploy
#
# O Postgres gerenciado (Neon/Supabase/Fly Postgres) fica fora deste arquivo:
# assim o volume e o banco não dependem de um único processo.

app = "vivialert"
primary_region = "gru"

[build]
  dockerfile = "backend/Dockerfile"
  target = "prod"

[env]
  PORT = "3000"
  PRICE_PROVIDER = "serpapi"
  # O vigia interno fica desligado: quem dispara as checagens é o cron do
  # GitHub Actions (chamando POST /watch/run), que acorda o app quando precisa.
  # Deixe "true" se preferir um processo sempre ligado.
  WATCH_ENABLED = "false"
  CHECK_INTERVAL_MINUTES = "720"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # /health só devolve 200 se o banco responder.
    grace_period = "20s"
    interval = "60s"
    timeout = "5s"
    method = "GET"
    path = "/health"

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40
