# fly.toml app configuration file generated for vivialert on 2026-11-04T16:48:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vivialert'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  CHECK_INTERVAL_MINUTES = '720'
  PORT = '3000'
  PRICE_PROVIDER = 'serpapi'
  WATCH_ENABLED = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
